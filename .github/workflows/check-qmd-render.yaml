name: Check whether the report renders

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  render-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("ggplot2", "knitr", "rmarkdown", "here", "tinytest"))

      - name: Render the midterm report
        run: quarto render report/report.qmd --to all

      - name: Save rendered report
        uses: actions/upload-artifact@v4
        with:
          name: midterm-report
          if-no-files-found: error
          path: |
            report/report.html
            report/report.pdf
